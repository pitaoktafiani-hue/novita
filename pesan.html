
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan | DAIFUKU MOCHITA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="navbar">
    <a href="index.html" class="logo">🍓 DAIFUKU MOCHITA</a>
    <nav>
        <a href="index.html">Home</a>
        <a href="profil.html">Profil</a>
        <a href="produk.html">Produk</a>
        <a href="kontak.html">Kontak</a>
        <a class="active" href="pesan.html">Pesan</a>
    </nav>
</header>

<section class="page-heading">
    <p class="tagline">ORDER YOUR FAVORITE MOCHI</p>
    <h1>Form Pemesanan</h1>
    <p>Isi data berikut untuk memesan daifuku favoritmu.</p>
</section>

<section class="order-section">
    <form class="order-form" id="orderForm">
        <h2>🍓 Detail Pesanan</h2>

        <label for="nama">Nama lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama kamu" required>

        <label for="produk">Pilih produk</label>
        <select id="produk" required>
            <option value="">-- Pilih rasa mochi --</option>
            <option value="Strawberry Cheese">Strawberry Cheese - Rp10.000</option>
            <option value="Matcha Cheese">Matcha Cheese - Rp10.000</option>
            <option value="Chocolate">Chocolate - Rp10.000</option>
            <option value="Taro Cream">Taro Cream - Rp10.000</option>
            <option value="Vanilla Milk">Vanilla Milk - Rp10.000</option>
            <option value="Mix Mochi Box">Mix Mochi Box - Rp25.000</option>
        </select>

        <label for="jumlah">Jumlah pesanan</label>
        <input type="number" id="jumlah" min="1" max="100" value="1" required>

        <label for="alamat">Alamat pengiriman / pengambilan</label>
        <textarea id="alamat" rows="3" placeholder="Masukkan alamat kamu" required></textarea>

        <label for="catatan">Catatan tambahan (opsional)</label>
        <textarea id="catatan" rows="2" placeholder="Contoh: tanpa topping tambahan"></textarea>

        <button type="submit" class="btn submit-btn">
            Kirim Pesanan via WhatsApp ♡
        </button>

        <p class="note" id="pesanStatus">
            Pastikan nomor WhatsApp toko sudah diatur pada kode.
        </p>
    </form>
</section>

<footer>
    <p>© 2026 DAIFUKU MOCHITA · Made with ♡</p>
</footer>

<script>
    const nomorToko = "628169259713";
    // Ganti dengan nomor WhatsApp toko yang benar.
    // Gunakan kode negara 62 tanpa tanda +.

    document.getElementById("orderForm").addEventListener("submit", function(e) {
        e.preventDefault();

        const nama = document.getElementById("nama").value.trim();
        const produk = document.getElementById("produk").value;
        const jumlah = Number(document.getElementById("jumlah").value);
        const alamat = document.getElementById("alamat").value.trim();
        const catatan = document.getElementById("catatan").value.trim();

        if (!nama || !produk || !alamat || jumlah < 1) {
            alert("Mohon lengkapi data pesanan terlebih dahulu.");
            return;
        }

        const harga = produk === "Mix Mochi Box" ? 25000 : 10000;
        const total = harga * jumlah;

        const pesan =
            "Halo DAIFUKU MOCHITA! 🍓%0A%0A" +
            "*PESANAN MOCHI*%0A" +
            "Nama: " + nama + "%0A" +
            "Produk: " + produk + "%0A" +
            "Jumlah: " + jumlah + "%0A" +
            "Harga satuan: Rp" + harga.toLocaleString("id-ID") + "%0A" +
            "Total sementara: Rp" + total.toLocaleString("id-ID") + "%0A" +
            "Alamat: " + alamat + "%0A" +
            "Catatan: " + (catatan || "-");

        if (nomorToko === "628169259713") {
            alert("Ganti nomorToko pada kode dengan nomor WhatsApp toko kamu terlebih dahulu.");
            return;
        }

        window.open("https://wa.me/" + nomorToko + "?text=" + pesan, "_blank");
    });
</script>

</body>
</html>
